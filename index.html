<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USMS · Centro de Mando</title>
  <meta name="description" content="Sistema de control de personal, tesorería y Asuntos Internos del U.S. Marshals Service — GTAHUB Roleplay." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <!-- Pantalla de carga inicial -->
  <div id="loader" class="loader">
    <div class="loader-inner">
      <img class="loader-seal" src="assets/img/usms-seal.svg" alt="" width="96" height="96" />
      <div class="loader-spin"></div>
    </div>
    <div class="loader-txt">U.S. MARSHALS SERVICE</div>
    <div class="loader-sub">Cargando Centro de Mando…</div>
  </div>

  <!-- Pantalla de acceso (se muestra mientras no haya sesión) -->
  <div id="gate" class="gate"></div>

  <!-- Aplicación -->
  <div id="shell" class="shell" style="display:none">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <div class="badge-host" id="badge-host"></div>
        <div class="brand-txt">
          <div class="brand-title">U.S. MARSHALS</div>
          <div class="brand-sub">Service · Control Panel</div>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div class="motto">“Justice · Integrity · Service”</div>
        <div class="muted xsmall">GTAHUB Roleplay · Uso interno</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button id="menu-toggle" class="icon-btn menu" aria-label="Menú"></button>
        <div class="topbar-title">Centro de Mando — USMS</div>
        <div id="user-box" class="user-box"></div>
      </header>
      <main id="app" class="content"></main>
    </div>
  </div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
